<button onclick='sendeDaten()'>Senden</button>

<script>
function sendeDaten() {
    const kategorien = {};

    // Checkboxen auswerten
    document.querySelectorAll("input[type=checkbox]").forEach(cb => {
        if (!cb.checked) return;

        const [key, tag] = cb.name.split("###");

        if (!kategorien[key]) {
            kategorien[key] = [];
        }
        kategorien[key].push(parseInt(tag));
    });

    // Sortieren
    for (const k in kategorien) {
        kategorien[k].sort((a,b) => a - b);
    }

    // TXT-Inhalt
    let txt = "";
    for (const k of Object.keys(kategorien).sort()) {
        txt += `${k}: 	${kategorien[k].join(",")}\n`;
    }

    // Monat aus Dropdown (MMYYYY)
    const sel = document.querySelector("select[name='MONAT_WAHL']");
    const monatJahr = sel ? sel.value : "032026";

    // Dateiname: MA-Name_MANr_MMYYYY.txt
    const maName = "Anna".replace(/[^a-zA-Z0-9_-]/g, "_");
    const maNr = "MA_01".replace(/[^a-zA-Z0-9_-]/g, "_");
    const filename = maName + "_" + maNr + "_" + monatJahr + ".txt";

    const blob = new Blob([txt], {type: "text/plain"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);
}
</script>
